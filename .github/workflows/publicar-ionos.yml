# Publica la carpeta site/ en el hosting de IONOS cada vez que se sube algo a main.
# Copia y sustituye ficheros, pero NO borra nada de lo que ya hay en IONOS
# (así se respetan .htaccess, redirecciones y ficheros que solo estén allí).
#
# Datos que hay que guardar en GitHub → Settings → Secrets and variables → Actions:
#   IONOS_HOST      servidor SFTP (p. ej. access-1234567.webspace-host.com)
#   IONOS_USER      usuario SFTP
#   IONOS_PASSWORD  contraseña SFTP
#   IONOS_DIR       (opcional) carpeta de la web en IONOS; si no se pone, la raíz "/"

name: Publicar en IONOS

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch: {}

concurrency:
  group: publicar-ionos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.IONOS_HOST }}
      USUARIO: ${{ secrets.IONOS_USER }}
      CLAVE: ${{ secrets.IONOS_PASSWORD }}
      DESTINO: ${{ secrets.IONOS_DIR }}
    steps:
      - name: Comprobar que están los datos de IONOS
        run: |
          if [ -z "$HOST" ] || [ -z "$USUARIO" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos IONOS_HOST, IONOS_USER o IONOS_PASSWORD en GitHub."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir site/ a IONOS por SFTP
        run: |
          lftp -u "$USUARIO","$CLAVE" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=4 \
              --exclude-glob index-viejo.html \
              site/ ${DESTINO:-/};
            bye"

      - name: Comprobar la web publicada
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "araceliteruel.es responde %{http_code}\n" https://araceliteruel.es/
